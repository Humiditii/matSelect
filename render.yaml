services:
  - type: web
    name: matselect-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: prod
      - key: LOG_CONSOLE
        value: "true"
      - key: SERVICE_NAME
        value: matselect-api
      - key: DB_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY 
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_EFFORT
        value: medium
      - key: LLM_TIMEOUT_MS
        value: "120000"
      - key: MATERIALS_PER_FAMILY
        value: "10"
      - key: MC_SAMPLES
        value: "1000"
      - key: RATE_LIMIT_PER_MIN
        value: "30"

  - type: web
    name: matselect-web
    runtime: node
    rootDir: web
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
